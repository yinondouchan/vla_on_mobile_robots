[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-playground"
version = "0.1.0"
description = "MuJoCo mobile lift robot playground for VLA training with LeRobot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[smolvla, dataset]==0.5.1",
    "mujoco>=3.9",
    "pygame>=2.6",
    "fire>=0.7",
    "matplotlib>=3.10",
    "huggingface-hub>=0.25",
    "bitsandbytes>=0.46.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["vlamobile*"]
